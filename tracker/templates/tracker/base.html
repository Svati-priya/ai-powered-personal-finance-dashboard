<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <style>
        body {
            font-family: "Segoe UI", Arial, sans-serif;
            background: linear-gradient(135deg, #f7f3e1, #F2E9CE);
            margin: 0;
            padding: 0;
            color: #1e0403;
        }

        nav {
            background: linear-gradient(90deg, #73573F, #1e0403);
            padding: 16px 24px;
            display: flex;
            gap: 20px;
            align-items: center;
            box-shadow: 0 4px 12px rgba(30, 4, 3, 0.15);
        }

        nav a {
            color: #f7f3e1;
            text-decoration: none;
            font-weight: 600;
            font-size: 16px;
            transition: 0.2s ease;
        }

        nav a:hover {
            color: #dcceff;
        }

        .container {
            width: 88%;
            margin: 32px auto;
        }

        h2, h3 {
            margin-bottom: 18px;
            color: #73573F;
        }

        .cards {
            display: flex;
            gap: 20px;
            margin-bottom: 32px;
            flex-wrap: wrap;
        }

        .card {
            flex: 1;
            min-width: 220px;
            padding: 24px;
            border-radius: 20px;
            color: #1e0403;
            font-size: 20px;
            font-weight: bold;
            box-shadow: 0 8px 20px rgba(115, 87, 63, 0.12);
        }

        .income {
            background: linear-gradient(135deg, #E4DFC2, #D9B573);
        }

        .expense {
            background: linear-gradient(135deg, #D9B573, #c89a4d);
        }

        .balance {
            background: linear-gradient(135deg, #dcceff, #c9b4ff);
        }

        .panel {
            background: rgba(255, 255, 255, 0.6);
            border: 1px solid rgba(217, 181, 115, 0.25);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 8px 20px rgba(115, 87, 63, 0.08);
            margin-bottom: 24px;
            backdrop-filter: blur(6px);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: rgba(255, 255, 255, 0.72);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(115, 87, 63, 0.08);
        }

        th, td {
            padding: 14px;
            text-align: center;
            border: 1px solid #e7dcc0;
        }

        th {
            background: #73573F;
            color: #f7f3e1;
        }

        tr:nth-child(even) {
            background: #f9f5ea;
        }

        .btn, .delete-btn {
            display: inline-block;
            padding: 9px 14px;
            text-decoration: none;
            border-radius: 999px;
            border: none;
            cursor: pointer;
            font-size: 14px;
            margin-right: 6px;
            font-weight: 600;
            transition: 0.2s ease;
        }

        .btn {
            background: #dcceff;
            color: #1e0403;
        }

        .btn:hover {
            background: #c9b4ff;
        }

        .delete-btn {
            background: #73573F;
            color: #f7f3e1;
        }

        .delete-btn:hover {
            background: #5f4632;
        }

        form {
            background: rgba(255, 255, 255, 0.7);
            padding: 22px;
            border-radius: 18px;
            box-shadow: 0 8px 20px rgba(115, 87, 63, 0.08);
        }

        form p {
            margin-bottom: 16px;
        }

        label {
            font-weight: 600;
            color: #73573F;
        }

        input, select, textarea {
            width: 100%;
            padding: 11px;
            margin-top: 6px;
            border: 1px solid #d8c9a8;
            border-radius: 10px;
            box-sizing: border-box;
            background: #fffdf7;
            color: #1e0403;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #dcceff;
            box-shadow: 0 0 0 3px rgba(220, 206, 255, 0.35);
        }

        canvas {
            max-width: 100%;
        }
    </style>
</head>
<body>

<nav>
    <a href="{% url 'dashboard' %}">Dashboard</a>
    <a href="{% url 'add_transaction' %}">Add Transaction</a>

    {% if user.is_authenticated %}
        <a href="{% url 'logout' %}">Logout</a>
    {% else %}
        <a href="{% url 'login' %}">Login</a>
        <a href="{% url 'register' %}">Register</a>
    {% endif %}
</nav>

    <div class="container">
        {% block content %}
        {% endblock %}
    </div>

</body>
</html>
